server:
  port: 9999

spring:
  application:
    name: configserver
  profiles:
    active: ${CONFIG_SERVER_PROFILE:native}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:rabbitapp}
    password: ${SPRING_RABBITMQ_PASSWORD:rabbit_secret_pass_2026}
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO_PATH:file:./config-repo,file:/app/config-repo,classpath:/config-repo}
        git:
          uri: ${CONFIG_REPO_GIT_URI:https://github.com/youssefbn9/config-repo.git}
          default-label: main
          clone-on-start: true
          username: ${CONFIG_REPO_GIT_USERNAME:}
          password: ${CONFIG_REPO_GIT_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,busrefresh,monitor
  endpoint:
    health:
      show-details: always
