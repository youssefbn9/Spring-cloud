server:
  port: 8888

spring:
  application:
    name: gatewayserver
  config:
    import: optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9999}
  cloud:
    config:
      enabled: true
    discovery:
      enabled: true
    gateway:
      discovery:
        locator:
          enabled: true
          lowerCaseServiceId: true
      routes:
        - id: song-service
          uri: lb://SONG
          predicates:
            - Path=/api/songs/**
        - id: instrument-service
          uri: lb://INSTRUMENT
          predicates:
            - Path=/api/instruments/**
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:rabbitapp}
    password: ${SPRING_RABBITMQ_PASSWORD:rabbit_secret_pass_2026}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,busrefresh,monitor
  endpoint:
    health:
      show-details: always
    gateway:
      access: unrestricted
